server.port=8080

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/parking_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=parking
spring.datasource.password=parking
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-me-dev-secret-please-rotate-in-production-0123456789
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

springdoc.swagger-ui.path=/swagger-ui.html
logging.level.org.hibernate.SQL=debug
