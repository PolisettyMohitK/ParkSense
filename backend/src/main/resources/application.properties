spring.application.name=parking-platform
spring.profiles.default=dev
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Booking lifecycle (see BookingProperties)
app.booking.hold-before=15m
app.booking.arrival-grace=15m
app.booking.max-duration=24h
app.booking.max-advance=30d
app.booking.past-tolerance=5m
app.booking.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.booking.currency=INR

# Demo data and first admin (all off unless configured)
app.seed.demo=${APP_SEED_DEMO:false}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:admin123}
app.seed.manager-password=${DEMO_MANAGER_PASSWORD:manager123}
app.seed.user-password=${DEMO_USER_PASSWORD:user123}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

springdoc.swagger-ui.path=/swagger-ui.html
