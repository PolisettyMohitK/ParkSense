# Migration test: runs Flyway against a real MySQL given by the environment,
# then lets Hibernate validate the resulting schema (ddl-auto=validate).
# Skipped unless MIGRATION_TEST_DB_URL is set (see MigrationTest).
spring.datasource.url=${MIGRATION_TEST_DB_URL}
spring.datasource.username=${MIGRATION_TEST_DB_USERNAME}
spring.datasource.password=${MIGRATION_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173
app.scheduling.enabled=false
app.seed.demo=false
