# Local full-stack demo. Copy .env.example to .env first - secrets live there,
# never in this file.
services:
  mysql:
    image: mysql:8.4
    container_name: parking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (cp .env.example .env)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-parking_platform}
      MYSQL_USER: ${MYSQL_USER:-parking}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env (cp .env.example .env)}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend/Dockerfile
    container_name: parking-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-parking_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-parking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env (cp .env.example .env)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (cp .env.example .env)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    container_name: parking-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

  vision-service:
    build:
      context: .
      dockerfile: infrastructure/docker/vision/Dockerfile
    container_name: parking-vision
    environment:
      PARKING_API_URL: http://backend:8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (cp .env.example .env)}
      VISION_ALLOWED_ORIGINS: ${VISION_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      PARKING_USER: ${VISION_PARKING_USER:-manager@parking.dev}
      PARKING_PASSWORD: ${VISION_PARKING_PASSWORD:?set VISION_PARKING_PASSWORD in .env (cp .env.example .env)}
      CAMERA_CODE: ${CAMERA_CODE:-CAM-L1}
    ports:
      - "8001:8001"
    depends_on:
      - backend

volumes:
  mysql-data:
